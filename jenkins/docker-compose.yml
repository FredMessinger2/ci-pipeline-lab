services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"
    environment:
      # Skip the interactive setup wizard; casc.yaml replaces it.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /usr/local/casc/casc.yaml
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:-admin}"
      # Host path of this repo. Needed because the pipeline launches sibling
      # containers via the HOST docker daemon: any -v volume path it passes is
      # resolved on the host, not inside the Jenkins container.
      HOST_REPO: "${HOST_REPO}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace:ro
      - ./casc.yaml:/usr/local/casc/casc.yaml:ro
    # Membership in the host's docker group so the jenkins user may use the
    # socket. GID comes from .env (stat -c '%g' /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID}"
    restart: unless-stopped

volumes:
  jenkins_home:
